<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetlet: Solar Escape</title>
<meta name="description" content="Jetlet: Solar Escape — an arcade jumping game for Android.">
<link rel="icon" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f2f4ff;
    background: radial-gradient(circle at 50% 20%, #2a2f6b 0%, #0b0d24 70%);
    text-align: center;
  }
  img {
    width: 144px;
    height: 144px;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
  }
  h1 { margin: 24px 0 8px; font-size: 2rem; }
  p { margin: 0 0 28px; max-width: 420px; line-height: 1.5; color: #b9bfe6; }
  a.button {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 999px;
    background: #ffb238;
    color: #1a1400;
    font-weight: 700;
    text-decoration: none;
  }
  a.button:hover { background: #ffc566; }
  footer { margin-top: 48px; font-size: .85rem; color: #7d84b3; }
</style>
</head>
<body>
  <img src="icon.png" alt="Jetlet: Solar Escape icon">
  <h1>Jetlet: Solar Escape</h1>
  <p>An arcade jumping game for Android. Jump, dodge and escape the sun.</p>
  <a class="button" href="https://play.google.com/store/apps/details?id=com.eternalsky.jetlet">Get it on Google Play</a>
  <footer>&copy; 2026 Eternal Sky</footer>
</body>
</html>
